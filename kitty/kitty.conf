# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 2.0
copy_on_select yes

# Bell
enable_audio_bell no
visual_bell_duration 0

# Window
window_padding_width 12
confirm_os_window_close 0
background_opacity 0.92
dynamic_background_opacity yes

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Nighttime Theme
foreground              #d0d0dd
background              #0a0a12
selection_foreground    #0a0a12
selection_background    #c8a0e8

# Cursor colors
cursor                  #c8a0e8
cursor_text_color       #0a0a12

# URL underline color
url_color               #60a0c0

# Tab bar colors
active_tab_foreground   #0a0a12
active_tab_background   #8a64b4
inactive_tab_foreground #777788
inactive_tab_background #15151f
tab_bar_background      #0a0a12

# Nighttime color palette with accents
# Black/dark
color0  #15151f
color8  #404055

# Red -> Soft rose/pink
color1  #c06080
color9  #e08090

# Green -> Muted teal
color2  #60a090
color10 #80c0a0

# Yellow -> Warm amber
color3  #c0a060
color11 #e0c080

# Blue -> Night sky blue
color4  #6080c0
color12 #80a0e0

# Magenta -> Purple (main accent)
color5  #9d7cd8
color13 #c8a0e8

# Cyan -> Moonlight cyan
color6  #60a0b8
color14 #80c0d8

# White/gray
color7  #b0b0c0
color15 #e0e0e8

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
