# Hyprland Config for Asahi Linux

# Monitor setup (auto-detect) - scale 1.5 for HiDPI MacBook display
monitor = , preferred, auto, 1.5

# Execute on startup
exec-once = waybar
exec-once = swaybg -c '#0a0a12'
exec-once = mako
exec-once = nm-applet --indicator
# hypridle isn't packaged for Fedora (no repo, no enabled COPR ships it) --
# swayidle is the actually-available equivalent; flags below reproduce the
# same policy that was written in hypridle.conf (now unused/vestigial).
exec-once = swayidle -w timeout 150 'brightnessctl -s set 30%' resume 'brightnessctl -r' timeout 300 'loginctl lock-session' timeout 330 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' timeout 900 'systemctl suspend' before-sleep 'loginctl lock-session' after-resume 'hyprctl dispatch dpms on' lock 'pidof swaylock || swaylock'
exec-once = ~/.config/hypr/startup.sh

# Clipboard persistence: wl-clipboard's protocol has the SOURCE app serve
# clipboard data on demand, so if that app closes, the clipboard goes with
# it. clipman (NOT raw `wl-paste --watch wl-copy` -- that chain doesn't
# reliably hold ownership, wl-copy's backgrounded server gets reaped by
# wl-paste between watch cycles) stores clipboard history; SUPER+SHIFT+C to
# pick/restore anything, including after the source app is long gone.
# Requires: sudo dnf install clipman
exec-once = wl-paste --type text --watch clipman store --no-persist

# Environment variables
env = XCURSOR_SIZE,36
env = QT_QPA_PLATFORMTHEME,qt5ct
# Run Electron apps (VS Code, etc.) as native Wayland clients instead of
# XWayland. XWayland<->native-Wayland clipboard sync is the other common
# cause of "copy/paste is broken" reports (copy in VS Code, paste in a
# Wayland-native app fails or vice versa).
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    repeat_delay = 400
    repeat_rate = 35
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
        clickfinger_behavior = true
        middle_button_emulation = true
        tap_button_map = lrm
    }
}

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8a64b4ff) rgba(6a4c93ff) 45deg
    col.inactive_border = rgba(333344aa)
    layout = dwindle
}

# Decoration (shadows, blur, rounding)
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    bezier = easeOut, 0, 0, 0.2, 1

    animation = windows, 1, 4, ease, slide
    animation = windowsOut, 1, 4, easeOut, slide
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
    animation = border, 1, 5, ease
}

# Layout settings
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# Gestures (useful for trackpad)
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Window rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$

# Keybindings
$mainMod = SUPER

# Core
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, E, exec, dolphin
bind = $mainMod, Space, exec, wofi --show drun
# SUPER+C = copy; clipboard history picker is on SUPER+SHIFT+C.
bind = $mainMod, C, exec, ~/.config/hypr/scripts/copy.sh
bind = $mainMod SHIFT, C, exec, clipman pick -t wofi
# SUPER+V = paste (Mac muscle memory), not float toggle -- that moved below.
bind = $mainMod, V, exec, ~/.config/hypr/scripts/paste.sh
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod, S, togglesplit
bind = $mainMod, Escape, exec, swaylock
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Move focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Arrow key alternatives
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (requires grim + slurp)
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Media keys (Apple keyboard)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; ~/.config/hypr/scripts/osd.sh volume
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; ~/.config/hypr/scripts/osd.sh volume
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; ~/.config/hypr/scripts/osd.sh volume

# (No raw code:121-123 duplicates: those ARE the XF86Audio* keys, so each press
# fired twice -- 10% steps, and mute toggled straight back.)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Fallback volume/brightness (Super + F keys for Apple keyboard)
bindel = $mainMod, F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+; ~/.config/hypr/scripts/osd.sh volume
bindel = $mainMod, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; ~/.config/hypr/scripts/osd.sh volume
bindl = $mainMod, F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; ~/.config/hypr/scripts/osd.sh volume
bindel = $mainMod, F2, exec, brightnessctl set 5%+; ~/.config/hypr/scripts/osd.sh brightness
bindel = $mainMod, F1, exec, brightnessctl set 5%-; ~/.config/hypr/scripts/osd.sh brightness

# Brightness keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+; ~/.config/hypr/scripts/osd.sh brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-; ~/.config/hypr/scripts/osd.sh brightness


