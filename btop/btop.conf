#? Config file for btop

# Theme - using custom nighttime theme
color_theme = "nighttime"

# Update time in milliseconds
update_ms = 1000

# Rounded corners
rounded_corners = True

# Graph symbol to use
graph_symbol = "braille"

# Show battery stats
show_battery = True

# Show process memory as percentage instead of bytes
mem_as_bytes = False

# Show swap
show_swap = True

# Show disks
show_disks = True

# Show IO stats
show_io_stat = True

# Process sorting
proc_sorting = "cpu lazy"

# Tree view for processes
proc_tree = False

# Show CPU graph
cpu_graph_upper = "total"
cpu_graph_lower = "total"

# Show mem and disk together
mem_graphs = True
