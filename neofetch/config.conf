# Neofetch config - Nighttime Purple Theme

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Battery" battery

    info cols
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="on"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="on"

# Battery
battery_display="barinfo"

# Colors - Nighttime Purple Theme
colors=(5 5 5 5 5 7)
#        ^title
#          ^@ symbol
#            ^underline
#              ^subtitle
#                ^colon
#                  ^info

# Bold
bold="on"

# Underline
underline_enabled="on"
underline_char="─"

# Separator
separator=" ›"

# Color Blocks
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# Progress Bars
bar_char_elapsed="▓"
bar_char_total="░"
bar_border="on"
bar_length=15
bar_color_elapsed="5"
bar_color_total="8"

# Info display
cpu_display="barinfo"
memory_display="barinfo"
battery_display="barinfo"
disk_display="barinfo"

# Backend Settings
image_backend="ascii"
image_source="auto"

# Ascii Options
ascii_distro="auto"
ascii_colors=(5 5 5 5 5 5)
ascii_bold="on"

# Image Options
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"

# Crop mode
crop_mode="normal"
crop_offset="center"

# Image size
image_size="auto"

# Gap between image and text
gap=3

# Stdout mode
stdout="off"
